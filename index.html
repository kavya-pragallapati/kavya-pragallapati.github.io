<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavya.Work</title>
    <style>
        /* Base Reset & Page Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Right Navigation Header & History Button */
        #top-header {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 10;
        }

        .history-btn {
            background-color: #242424;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .history-btn:hover {
            border-color: #00adb5;
            color: #00adb5;
            background-color: #1a1a1a;
        }

        /* Top 70%: Dialogue Window */
        #story-container {
            height: 60vh;
            overflow-y: auto;
            padding: 40px 24px 24px 24px;
            background-color: #1a1a1a;
            border-bottom: 3px solid #333;
        }

        /* Game Title Styling */
        .game-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 173, 181, 0.4);
        }

        .dialogue-box {
            max-width: 800px;
            margin: 0 auto;
            background-color: #242424;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer; /* Indicates user can click to skip typing */
        }

        .dialogue-box p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .dialogue-box p:last-child {
            margin-bottom: 0;
        }

        /* Typewriter Cursor Effect */
        .typing-cursor::after {
            content: '▋';
            display: inline-block;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            color: #ffffff;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Bottom 30%: Response Choices Window */
        #choices-container {
            height: 40vh;
            overflow-y: auto;
            padding: 20px;
            background-color: #121212;
        }

        .choices-list {
            max-width: 800px;
            margin: 0 auto;
            list-style: none;
        }

        /* Individual Choice Styling */
        .choice-item {
            position: relative;
            padding: 12px 16px 12px 36px;
            margin-bottom: 10px;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
        }

        .choice-item::before {
            content: '▶';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 0.8rem;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        /* Distinct styling for previously selected options */
        .choice-item.visited {
            opacity: 0.6;
            background-color: #161616;
            border-style: dashed;
        }

        .choice-item.visited::before {
            content: '✓';
            color: #555;
        }

        /* Distinct styling for "More..." option */
        .choice-item.more-btn {
            border-color: #555;
            color: #aaaaaa;
            font-style: italic;
        }

        /* Hover & Focus Effects */
        .choice-item:hover {
            background-color: #2a2a2a;
            border-color: #00adb5;
            color: #ffffff;
            opacity: 1;
            transform: translateX(4px);
        }

        .choice-item:hover::before {
            color: #00adb5;
            transform: translateY(-50%) translateX(2px);
        }

        /* History Drawer Modal */
        #history-drawer {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100vh;
            background-color: #181818;
            border-left: 2px solid #333;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.7);
            z-index: 100;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        #history-drawer.open {
            right: 0;
        }

        .history-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .history-list {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            list-style: none;
        }

        .history-entry {
            padding: 10px;
            margin-bottom: 8px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .history-entry:hover {
            border-color: #00adb5;
            color: #00adb5;
        }

        /* Reset Progress Button inside Drawer */
        .reset-btn-container {
            padding: 20px;
            border-top: 1px solid #333;
        }

        .reset-btn {
            width: 100%;
            background-color: #2b1414;
            color: #ff5555;
            border: 1px solid #ff5555;
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #ff5555;
            color: #ffffff;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>

    <!-- TOP RIGHT HEADER (WITH HISTORY BUTTON) -->
    <header id="top-header">
        <button class="history-btn" id="open-history">
            <span class="icon">📜</span> 
            <span>History</span>
        </button>
    </header>

    <!-- TOP SECTION: Story Container (70% Height) -->
    <main id="story-container">
        <h1 class="game-title">Kavya.Work</h1>
        <div class="dialogue-box" id="dialogue-box">
            <!-- Story paragraphs injected dynamically -->
        </div>
    </main>

    <!-- BOTTOM SECTION: Response Choices Window (30% Height) -->
    <footer id="choices-container">
        <ul class="choices-list" id="choices-list">
            <!-- Rendered dynamically -->
        </ul>
    </footer>

    <!-- HISTORY SLIDE-OUT PANEL -->
    <aside id="history-drawer">
        <div class="history-header">
            <h3>Adventure History</h3>
            <button class="close-btn" id="close-history">&times;</button>
        </div>
        <ul class="history-list" id="history-list">
            <!-- List of clicked choices injected here -->
        </ul>
        <div class="reset-btn-container">
            <button id="reset-progress-btn" class="reset-btn">Reset All Progress</button>
        </div>
    </aside>

    <script>
        // -------------------------------------------------------------
        // PAGE SPECIFIC DATA (Customize for each page file)
        // -------------------------------------------------------------
        const currentPageFile = "index.html"; 
       const storyContent = [
        "Hi! I am Kavya Pragallapati.",
        "I see you have stumbled onto my personal corner of the internet.",
        "Here you'll find, little bit of my work, a slice of my thoughts, and some of the fun stuff that I have been working on. Let me know what you want to see first!"
    ];

    const choicesData = [
        { id: "choice_1", text: "Can you tell me about your work?", target: "work.html" },
        { id: "choice_2", text: "Tell me about yourself.", target: "aboutme.html" },
        { id: "choice_3", text: "What do you do for fun around here?", target: "funstuff.html" },
        { id: "choice_4", text: "Can I read one of your blogs?", target: "blogs.html" },
        { id: "choice_5", text: "How do I contact you?", target: "contact.html" },
        { id: "choice_6", text: "Wait and listen to the ambient noise.", target: "crickets.html" },
        { id: "choice_7", text: "I am an introvert. [Exit text RPG mode]", target: "Traditional Style/index.html" }
        
    ];

        const ITEMS_PER_PAGE = 4;
        const TYPE_SPEED = 40; // Speed in ms per character (lower = faster)

        // -------------------------------------------------------------
        // TYPEWRITER ENGINE
        // -------------------------------------------------------------
        let currentParaIndex = 0;
        let currentCharIndex = 0;
        let typingTimer = null;
        let isTyping = false;
        let createdParagraphs = [];

        const dialogueBox = document.getElementById('dialogue-box');

        function startTypewriter() {
            dialogueBox.innerHTML = ""; 
            createdParagraphs = [];
            
            storyContent.forEach(() => {
                const p = document.createElement('p');
                dialogueBox.appendChild(p);
                createdParagraphs.push(p);
            });

            currentParaIndex = 0;
            currentCharIndex = 0;
            isTyping = true;
            
            typeNextChar();
        }

        function typeNextChar() {
            if (currentParaIndex >= storyContent.length) {
                isTyping = false;
                removeCursor();
                return;
            }

            const currentP = createdParagraphs[currentParaIndex];
            const fullText = storyContent[currentParaIndex];

            removeCursor();
            currentP.classList.add('typing-cursor');

            currentP.textContent = fullText.substring(0, currentCharIndex + 1);
            currentCharIndex++;

            const storyContainer = document.getElementById('story-container');
            storyContainer.scrollTop = storyContainer.scrollHeight;

            if (currentCharIndex < fullText.length) {
                typingTimer = setTimeout(typeNextChar, TYPE_SPEED);
            } else {
                currentParaIndex++;
                currentCharIndex = 0;
                typingTimer = setTimeout(typeNextChar, TYPE_SPEED * 8);
            }
        }

        function removeCursor() {
            createdParagraphs.forEach(p => p.classList.remove('typing-cursor'));
        }

        // Instant text skip on click
        dialogueBox.addEventListener('click', () => {
            if (isTyping) {
                clearTimeout(typingTimer);
                createdParagraphs.forEach((p, index) => {
                    p.textContent = storyContent[index];
                });
                removeCursor();
                isTyping = false;
            }
        });

        // -------------------------------------------------------------
        // STATE & LOCAL STORAGE MANAGERS
        // -------------------------------------------------------------
        function getVisitedChoiceIds() {
            return JSON.parse(localStorage.getItem('visited_choices') || '[]');
        }

        function getNavHistory() {
            return JSON.parse(localStorage.getItem('nav_history') || '[]');
        }

        function recordChoice(choiceId, choiceText, pageFile) {
            const visited = getVisitedChoiceIds();
            if (!visited.includes(choiceId)) {
                visited.push(choiceId);
                localStorage.setItem('visited_choices', JSON.stringify(visited));
            }

            const history = getNavHistory();
            history.push({
                text: choiceText,
                page: pageFile
            });
            localStorage.setItem('nav_history', JSON.stringify(history));
        }

        // -------------------------------------------------------------
        // UI RENDERERS
        // -------------------------------------------------------------
        function getPrioritizedChoices() {
            const visitedIds = getVisitedChoiceIds();
            const unvisited = [];
            const visited = [];

            choicesData.forEach(choice => {
                if (visitedIds.includes(choice.id)) {
                    visited.push({ ...choice, isVisited: true });
                } else {
                    unvisited.push({ ...choice, isVisited: false });
                }
            });

            return [...unvisited, ...visited];
        }

        let currentPageIndex = 0;

        function renderChoices() {
            const listContainer = document.getElementById("choices-list");
            listContainer.innerHTML = "";

            const prioritizedList = getPrioritizedChoices();
            const totalPages = Math.ceil(prioritizedList.length / ITEMS_PER_PAGE);
            const startIndex = currentPageIndex * ITEMS_PER_PAGE;
            const currentChoices = prioritizedList.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            currentChoices.forEach((choice) => {
                const li = document.createElement("li");
                li.className = "choice-item" + (choice.isVisited ? " visited" : "");
                li.textContent = choice.text;
                
                li.addEventListener("click", () => {
                    recordChoice(choice.id, choice.text, currentPageFile);
                    window.location.href = choice.target;
                });

                listContainer.appendChild(li);
            });

            if (totalPages > 1) {
                const moreLi = document.createElement("li");
                moreLi.className = "choice-item more-btn";
                moreLi.textContent = "More...";
                
                moreLi.addEventListener("click", () => {
                    currentPageIndex = (currentPageIndex + 1) % totalPages;
                    renderChoices();
                    document.getElementById("choices-container").scrollTop = 0;
                });

                listContainer.appendChild(moreLi);
            }
        }

        function renderHistoryList() {
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";

            const history = getNavHistory();
            if (history.length === 0) {
                historyList.innerHTML = "<li style='color:#777; font-style:italic;'>No history yet.</li>";
                return;
            }

            history.forEach((step, index) => {
                const li = document.createElement("li");
                li.className = "history-entry";
                li.textContent = `${index + 1}. ${step.text}`;
                
                li.addEventListener("click", () => {
                    const trimmedHistory = history.slice(0, index);
                    localStorage.setItem('nav_history', JSON.stringify(trimmedHistory));
                    window.location.href = step.page;
                });

                historyList.appendChild(li);
            });
        }

        // -------------------------------------------------------------
        // EVENT LISTENERS & INITIALIZATION
        // -------------------------------------------------------------
        const drawer = document.getElementById("history-drawer");
        document.getElementById("open-history").addEventListener("click", () => {
            renderHistoryList();
            drawer.classList.add("open");
        });
        
        document.getElementById("close-history").addEventListener("click", () => {
            drawer.classList.remove("open");
        });

        document.getElementById('reset-progress-btn').addEventListener('click', () => {
            if (confirm("Are you sure you want to reset all choice history and start fresh?")) {
                localStorage.removeItem('visited_choices');
                localStorage.removeItem('nav_history');
                window.location.href = "index.html"; 
            }
        });

        // Start Engine
        startTypewriter();
        renderChoices();
    </script>
</body>
</html>
