<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavya.Work</title>
    <style>
        /* Base Reset & Page Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Right Navigation Header & History Button */
        #top-header {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 10;
        }

        .history-btn {
            background-color: #242424;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .history-btn:hover {
            border-color: #00adb5;
            color: #00adb5;
            background-color: #1a1a1a;
        }

        /* Top Section: Dialogue Window */
        #story-container {
            height: 60vh;
            overflow-y: auto;
            padding: 30px 24px 20px 24px;
            background-color: #1a1a1a;
            border-bottom: 3px solid #333;
        }

        /* Game Title Styling */
        .game-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 173, 181, 0.4);
        }

        .dialogue-box {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #242424;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.4s ease;
        }

        /* Side-by-Side Flex Layout when Image is present */
        .dialogue-box.has-image {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .dialogue-text-column {
            flex: 1; /* Takes up left side space */
        }

        /* Image Carousel Column Styling */
        .dialogue-image-column {
            flex: 1; /* Takes up right side space */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-width: 50%;
        }

        .carousel-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Constrained Image Dimensions (No Page Scroll) */
        .dialogue-image {
            max-width: 100%;
            max-height: 38vh; /* Fits inside viewport height dynamically */
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid #444;
            display: none; /* Controlled via Carousel JS */
            cursor: zoom-in; /* Indicates expandable image */
            animation: fadeIn 0.4s ease-in-out;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .dialogue-image:hover {
            transform: scale(1.02);
            border-color: #00adb5;
        }

        .dialogue-image.active-slide {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Carousel Navigation Controls */
        .carousel-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px 12px;
            margin-top: 4px;
        }

        .carousel-btn {
            background-color: #2a2a2a;
            color: #00adb5;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 4px 12px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .carousel-btn:hover {
            background-color: #00adb5;
            color: #121212;
            border-color: #00adb5;
        }

        .carousel-counter {
            font-size: 0.85rem;
            color: #aaa;
            letter-spacing: 1px;
        }

        .dialogue-box p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .dialogue-box p:last-child {
            margin-bottom: 0;
        }

        /* Typewriter Cursor Effect */
        .typing-cursor::after {
            content: '▋';
            display: inline-block;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            color: #ffffff;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* FULL SCREEN LIGHTBOX MODAL */
        #lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #lightbox-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 173, 181, 0.3);
            border: 2px solid #444;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        #lightbox-modal.open .lightbox-content {
            transform: scale(1);
        }

        .lightbox-close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            background: #242424;
            color: #ffffff;
            border: 1px solid #555;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .lightbox-close-btn:hover {
            background-color: #00adb5;
            color: #121212;
            border-color: #00adb5;
        }

        /* Responsive Layout for Mobile Devices */
        @media (max-width: 650px) {
            .dialogue-box.has-image {
                flex-direction: column;
            }
            .dialogue-image-column {
                max-width: 100%;
            }
            .dialogue-image {
                max-height: 25vh;
            }
        }

        /* Bottom Section: Response Choices Window */
        #choices-container {
            height: 40vh;
            overflow-y: auto;
            padding: 20px;
            background-color: #121212;
        }

        .choices-list {
            max-width: 800px;
            margin: 0 auto;
            list-style: none;
        }

        /* Individual Choice Styling */
        .choice-item {
            position: relative;
            padding: 12px 16px 12px 36px;
            margin-bottom: 10px;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
        }

        .choice-item::before {
            content: '▶';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 0.8rem;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .choice-item.visited {
            opacity: 0.6;
            background-color: #161616;
            border-style: dashed;
        }

        .choice-item.visited::before {
            content: '✓';
            color: #555;
        }

        .choice-item.more-btn {
            border-color: #555;
            color: #aaaaaa;
            font-style: italic;
        }

        .choice-item:hover {
            background-color: #2a2a2a;
            border-color: #00adb5;
            color: #ffffff;
            opacity: 1;
            transform: translateX(4px);
        }

        .choice-item:hover::before {
            color: #00adb5;
            transform: translateY(-50%) translateX(2px);
        }

        /* History Drawer Modal */
        #history-drawer {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100vh;
            background-color: #181818;
            border-left: 2px solid #333;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.7);
            z-index: 100;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        #history-drawer.open {
            right: 0;
        }

        .history-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .history-list {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            list-style: none;
        }

        .history-entry {
            padding: 10px;
            margin-bottom: 8px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .history-entry:hover {
            border-color: #00adb5;
            color: #00adb5;
        }

        .reset-btn-container {
            padding: 20px;
            border-top: 1px solid #333;
        }

        .reset-btn {
            width: 100%;
            background-color: #2b1414;
            color: #ff5555;
            border: 1px solid #ff5555;
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #ff5555;
            color: #ffffff;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>

    <header id="top-header">
        <button class="history-btn" id="open-history">
            <span class="icon">📜</span> 
            <span>History</span>
        </button>
    </header>

    <main id="story-container">
        <h1 class="game-title">Kavya.Work</h1>
        <div class="dialogue-box" id="dialogue-box"></div>
    </main>

    <footer id="choices-container">
        <ul class="choices-list" id="choices-list"></ul>
    </footer>

    <aside id="history-drawer">
        <div class="history-header">
            <h3>Adventure History</h3>
            <button class="close-btn" id="close-history">&times;</button>
        </div>
        <ul class="history-list" id="history-list"></ul>
        <div class="reset-btn-container">
            <button id="reset-progress-btn" class="reset-btn">Reset All Progress</button>
        </div>
    </aside>

    <!-- FULL SCREEN LIGHTBOX MODAL -->
    <div id="lightbox-modal">
        <button class="lightbox-close-btn" id="close-lightbox">&times;</button>
        <img src="" alt="Expanded View" class="lightbox-content" id="lightbox-img">
    </div>

    <script>
        const currentPageFile = "index.html"; 

        // -------------------------------------------------------------
        // MULTIPLE STORY ALTERNATIVES
        // -------------------------------------------------------------
        const storyAlternatives = {
            default: [
                "Of course!",
                "I am a content writer / level designer. I started off my journey in gaming by making crosswords for Daily Themed Crosswords, Crossword Explorer, and Crossword Go.",
                "I ventured into non-crossword based word game content design with Offline Puzzle Master, where I curated content and built difficulty curves to optimize player engagement and retention.",
                "In my freetime, I like to play narrative puzzle games and breakdown the kind of work that would have gone into it."
            ],

            not_crossword: [
                "Kind of but not really, while the core of it remains crosswords, it's not all about making crosswords. I was the quality controller for all the images that went into Crossword Go puzzles.",
                { type: "image", src: "images/CSGO1.jpeg" }, 
                "These puzzles as you can see here have both text and image clues.",
            ]
        };

        const choicesData = [
            { id: "choice_8", text: "Is your work all about making crosswords?", target: "work.html" },
            { id: "choice_2", text: "Tell me about yourself.", target: "aboutme.html" },
            { id: "choice_9", text: "Tell me more about what you do in your freetime.", target: "funstuff.html" },
            { id: "choice_4", text: "I want to read one of your blogs.", target: "blogs.html" },
            { id: "choice_5", text: "How do I contact you?", target: "contact.html" },
            { id: "choice_6", text: "Wait quietly and listen to the ambient noise.", target: "crickets.html" },
            { id: "choice_10", text: "I'd like to explore by myself. [Exit text RPG mode]", target: "Traditional Style/index.html" }
        ];

        const ITEMS_PER_PAGE = 3;
        const TYPE_SPEED = 25;

        // -------------------------------------------------------------
        // VISITED CHOICE CHECKER
        // -------------------------------------------------------------
        function getVisitedChoiceIds() {
            return JSON.parse(localStorage.getItem('visited_choices') || '[]');
        }

        function hasVisited(requiredIds, matchMode = 'ALL') {
            const visited = getVisitedChoiceIds();
            if (matchMode === 'ALL') {
                return requiredIds.every(id => visited.includes(id));
            } else if (matchMode === 'ANY') {
                return requiredIds.some(id => visited.includes(id));
            }
            return false;
        }

        // -------------------------------------------------------------
        // EVALUATE & SELECT THE ACTIVE STORY VARIANT
        // -------------------------------------------------------------
        function selectActiveStory() {
            if (hasVisited(["choice_8"], "ALL")) {
                return storyAlternatives.not_crossword;
            }

            return storyAlternatives.default;
        }

        const storyContent = selectActiveStory();

        // -------------------------------------------------------------
        // LIGHTBOX OVERLAY LOGIC
        // -------------------------------------------------------------
        const lightboxModal = document.getElementById('lightbox-modal');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightboxBtn = document.getElementById('close-lightbox');

        function openLightbox(imageSrc) {
            lightboxImg.src = imageSrc;
            lightboxModal.classList.add('open');
        }

        function closeLightbox() {
            lightboxModal.classList.remove('open');
        }

        closeLightboxBtn.addEventListener('click', closeLightbox);
        lightboxModal.addEventListener('click', (e) => {
            if (e.target === lightboxModal) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightboxModal.classList.contains('open')) {
                closeLightbox();
            }
        });

        // -------------------------------------------------------------
        // CAROUSEL MANAGER STATE
        // -------------------------------------------------------------
        let imageElements = [];
        let currentImageIndex = 0;
        let counterDisplay = null;

        function updateCarouselView(newIndex) {
            if (imageElements.length === 0) return;

            imageElements.forEach((img, idx) => {
                if (idx === newIndex) {
                    img.classList.add('active-slide');
                } else {
                    img.classList.remove('active-slide');
                }
            });

            currentImageIndex = newIndex;
            if (counterDisplay) {
                counterDisplay.textContent = `${currentImageIndex + 1} / ${imageElements.length}`;
            }
        }

        // -------------------------------------------------------------
        // TYPEWRITER ENGINE WITH MULTI-IMAGE CAROUSEL SUPPORT
        // -------------------------------------------------------------
        let currentParaIndex = 0;
        let currentCharIndex = 0;
        let typingTimer = null;
        let isTyping = false;
        let createdElements = [];

        const dialogueBox = document.getElementById('dialogue-box');

        function startTypewriter() {
            dialogueBox.innerHTML = ""; 
            dialogueBox.classList.remove('has-image');
            createdElements = [];
            imageElements = [];
            currentImageIndex = 0;
            
            const containsImage = storyContent.some(item => typeof item === 'object' && item.type === 'image');

            let textContainer = dialogueBox;
            let imageContainer = null;
            let carouselWrapper = null;

            if (containsImage) {
                dialogueBox.classList.add('has-image');
                
                textContainer = document.createElement('div');
                textContainer.className = 'dialogue-text-column';
                
                imageContainer = document.createElement('div');
                imageContainer.className = 'dialogue-image-column';

                carouselWrapper = document.createElement('div');
                carouselWrapper.className = 'carousel-wrapper';
                imageContainer.appendChild(carouselWrapper);

                dialogueBox.appendChild(textContainer);
                dialogueBox.appendChild(imageContainer);
            }
            
            storyContent.forEach(item => {
                if (typeof item === 'object' && item.type === 'image') {
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.className = 'dialogue-image';
                    
                    // Click event to expand to full screen overlay
                    img.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openLightbox(item.src);
                    });

                    carouselWrapper.appendChild(img);
                    imageElements.push(img);
                    createdElements.push({ type: 'image', element: img });
                } else {
                    const p = document.createElement('p');
                    textContainer.appendChild(p);
                    createdElements.push({ type: 'text', element: p, text: item });
                }
            });

            // Build Carousel Controls if multiple images are present
            if (imageElements.length > 1) {
                const controls = document.createElement('div');
                controls.className = 'carousel-controls';

                const prevBtn = document.createElement('button');
                prevBtn.className = 'carousel-btn';
                prevBtn.textContent = '◀ Prev';
                prevBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const prevIdx = (currentImageIndex - 1 + imageElements.length) % imageElements.length;
                    updateCarouselView(prevIdx);
                });

                counterDisplay = document.createElement('span');
                counterDisplay.className = 'carousel-counter';
                counterDisplay.textContent = `1 / ${imageElements.length}`;

                const nextBtn = document.createElement('button');
                nextBtn.className = 'carousel-btn';
                nextBtn.textContent = 'Next ▶';
                nextBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const nextIdx = (currentImageIndex + 1) % imageElements.length;
                    updateCarouselView(nextIdx);
                });

                controls.appendChild(prevBtn);
                controls.appendChild(counterDisplay);
                controls.appendChild(nextBtn);
                imageContainer.appendChild(controls);
            }

            currentParaIndex = 0;
            currentCharIndex = 0;
            isTyping = true;
            
            typeNextChar();
        }

        function typeNextChar() {
            if (currentParaIndex >= storyContent.length) {
                isTyping = false;
                removeCursor();
                return;
            }

            const currentItem = createdElements[currentParaIndex];

            if (currentItem.type === 'image') {
                removeCursor();
                
                const revealedIndex = imageElements.indexOf(currentItem.element);
                updateCarouselView(revealedIndex);

                const storyContainer = document.getElementById('story-container');
                storyContainer.scrollTop = storyContainer.scrollHeight;

                currentParaIndex++;
                currentCharIndex = 0;
                typingTimer = setTimeout(typeNextChar, 400);
                return;
            }

            const currentP = currentItem.element;
            const fullText = currentItem.text;

            removeCursor();
            currentP.classList.add('typing-cursor');

            currentP.textContent = fullText.substring(0, currentCharIndex + 1);
            currentCharIndex++;

            const storyContainer = document.getElementById('story-container');
            storyContainer.scrollTop = storyContainer.scrollHeight;

            if (currentCharIndex < fullText.length) {
                typingTimer = setTimeout(typeNextChar, TYPE_SPEED);
            } else {
                currentParaIndex++;
                currentCharIndex = 0;
                typingTimer = setTimeout(typeNextChar, TYPE_SPEED * 8);
            }
        }

        function removeCursor() {
            createdElements.forEach(item => {
                if (item.type === 'text') item.element.classList.remove('typing-cursor');
            });
        }

        dialogueBox.addEventListener('click', (e) => {
            // Prevent dialogue skip when clicking carousel buttons or images
            if (e.target.classList.contains('carousel-btn') || e.target.classList.contains('dialogue-image')) return;

            if (isTyping) {
                clearTimeout(typingTimer);
                createdElements.forEach((item) => {
                    if (item.type === 'text') {
                        item.element.textContent = item.text;
                    }
                });
                if (imageElements.length > 0) {
                    updateCarouselView(0);
                }
                removeCursor();
                isTyping = false;
            }
        });

        // -------------------------------------------------------------
        // NAVIGATION & HISTORY MANAGERS
        // -------------------------------------------------------------
        function getNavHistory() {
            return JSON.parse(localStorage.getItem('nav_history') || '[]');
        }

        function recordChoice(choiceId, choiceText, pageFile) {
            const visited = getVisitedChoiceIds();
            if (!visited.includes(choiceId)) {
                visited.push(choiceId);
                localStorage.setItem('visited_choices', JSON.stringify(visited));
            }

            const history = getNavHistory();
            history.push({
                text: choiceText,
                page: pageFile
            });
            localStorage.setItem('nav_history', JSON.stringify(history));
        }

        // -------------------------------------------------------------
        // UI RENDERERS
        // -------------------------------------------------------------
        function getPrioritizedChoices() {
            const visitedIds = getVisitedChoiceIds();
            const unvisited = [];
            const visited = [];

            choicesData.forEach(choice => {
                if (visitedIds.includes(choice.id)) {
                    visited.push({ ...choice, isVisited: true });
                } else {
                    unvisited.push({ ...choice, isVisited: false });
                }
            });

            return [...unvisited, ...visited];
        }

        let currentPageIndex = 0;

        function renderChoices() {
            const listContainer = document.getElementById("choices-list");
            listContainer.innerHTML = "";

            const prioritizedList = getPrioritizedChoices();
            const totalPages = Math.ceil(prioritizedList.length / ITEMS_PER_PAGE);
            const startIndex = currentPageIndex * ITEMS_PER_PAGE;
            const currentChoices = prioritizedList.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            currentChoices.forEach((choice) => {
                const li = document.createElement("li");
                li.className = "choice-item" + (choice.isVisited ? " visited" : "");
                li.textContent = choice.text;
                
                li.addEventListener("click", () => {
                    recordChoice(choice.id, choice.text, currentPageFile);
                    window.location.href = choice.target;
                });

                listContainer.appendChild(li);
            });

            if (totalPages > 1) {
                const moreLi = document.createElement("li");
                moreLi.className = "choice-item more-btn";
                moreLi.textContent = "More...";
                
                moreLi.addEventListener("click", () => {
                    currentPageIndex = (currentPageIndex + 1) % totalPages;
                    renderChoices();
                    document.getElementById("choices-container").scrollTop = 0;
                });

                listContainer.appendChild(moreLi);
            }
        }

        function renderHistoryList() {
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";

            const history = getNavHistory();
            if (history.length === 0) {
                historyList.innerHTML = "<li style='color:#777; font-style:italic;'>No history yet.</li>";
                return;
            }

            history.forEach((step, index) => {
                const li = document.createElement("li");
                li.className = "history-entry";
                li.textContent = `${index + 1}. ${step.text}`;
                
                li.addEventListener("click", () => {
                    const trimmedHistory = history.slice(0, index);
                    localStorage.setItem('nav_history', JSON.stringify(trimmedHistory));
                    window.location.href = step.page;
                });

                historyList.appendChild(li);
            });
        }

        // -------------------------------------------------------------
        // EVENT LISTENERS & INITIALIZATION
        // -------------------------------------------------------------
        const drawer = document.getElementById("history-drawer");
        document.getElementById("open-history").addEventListener("click", () => {
            renderHistoryList();
            drawer.classList.add("open");
        });
        
        document.getElementById("close-history").addEventListener("click", () => {
            drawer.classList.remove("open");
        });

        document.getElementById('reset-progress-btn').addEventListener('click', () => {
            if (confirm("Are you sure you want to reset all choice history and start fresh?")) {
                localStorage.removeItem('visited_choices');
                localStorage.removeItem('nav_history');
                window.location.href = "index.html"; 
            }
        });

        // Start Engine
        startTypewriter();
        renderChoices();
    </script>
</body>
</html>
